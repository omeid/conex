name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          - "1.25" # Minimum required version (from go.mod)
          - "1.26" # Latest stable
          - "master"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go == 'master' && 'stable' || matrix.go }}
          check-latest: ${{ matrix.go == 'master' }}

      - name: Run tests
        run: go test -v -race ./...

      - name: Run glibctest with CGO_ENABLED=0
        run: CGO_ENABLED=0 go test -v ./internal/glibctest

      - name: Test Dependencies 
        run: ./ci/test_deps.sh


